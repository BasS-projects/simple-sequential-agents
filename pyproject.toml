[project]
name = "travel-policy-agents"
version = "0.1.0"
description = "Two-agent RAG assistant for international travel policy"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "openai-agents>=0.14.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
